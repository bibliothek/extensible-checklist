name: Build and publish container image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6885630C247C4FFC98794F8FD3DB32F7 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_EBC0ACCE4A654F1FBD291820949B710E }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            index.docker.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6885630C247C4FFC98794F8FD3DB32F7 }}/extensiblechecklist:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: matha-web-bump

    steps:
      - uses: actions/checkout@v4
        with:
          repository: bibliothek/matha-web
          token: ${{ secrets.MATHA_WEB_TOKEN }}

      - name: Bump extensiblechecklist tag in images.yml
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i -E "s#^(\s*image: .*/extensiblechecklist:).*#\1${SHA}#" images.yml
          if git diff --quiet; then
            echo "images.yml already at ${SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy extensiblechecklist ${SHA::7}" \
            -m "From ${{ github.server_url }}/${{ github.repository }}/commit/${SHA}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 2))
            git pull --rebase
          done
          exit 1
